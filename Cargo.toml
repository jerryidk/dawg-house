[package]
name = "studio"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Studio: a snippet-based recording studio (DAW) for Linux and Windows"
repository = "https://github.com/jerryidk/dawg-house"

[dependencies]
arc-swap = "1.9.3"
base64 = "0.22"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.13"
hound = "3.5.1"
libloading = "0.9.0"
rfd = "0.17"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

# Audio backends: JACK (incl. PipeWire's JACK) on Linux, cpal + midir on Windows.
[target.'cfg(target_os = "linux")'.dependencies]
jack = "0.13"

[target.'cfg(windows)'.dependencies]
# ASIO only (WASAPI is driven directly); realtime: MMCSS "Pro Audio" priority.
cpal = { version = "0.18", features = ["realtime"], optional = true }
midir = "0.11"
windows = { version = "0.62", features = [
    "Win32_Devices_Properties",
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_KernelStreaming",
    "Win32_Media_Multimedia",
    "Win32_System_Com",
    "Win32_System_Com_StructuredStorage",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Variant",
    "Win32_UI_Shell_PropertiesSystem",
] }

[features]
# ASIO on Windows (lowest latency). Needs the Steinberg ASIO SDK (CPAL_ASIO_DIR)
# and LLVM/Clang at build time; see WINDOWS.md.
asio = ["dep:cpal", "cpal/asio"]

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["eframe"] }

[lints.rust]
# `cfg(kani)` is set by the Kani model checker (`cargo kani`); see VERIFICATION.md.
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(kani)'] }

[profile.release]
# Smaller release binaries; panics still print a message.
strip = true
