[package]
name = "studio"
version = "0.1.0"
edition = "2024"

[dependencies]
arc-swap = "1.9.3"
base64 = "0.22"
eframe = { version = "0.35", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui-phosphor = "0.13"
hound = "3.5.1"
jack = "0.13"
libloading = "0.9.0"
rfd = "0.17"
rtrb = "0.4.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"

[dev-dependencies]
egui_kittest = { version = "0.35", features = ["eframe"] }
